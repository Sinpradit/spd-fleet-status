name: update-fleet-status

on:
  schedule:
    # every 15 min at off-peak minutes, but ONLY during 05:00-23:00 Thai (UTC+7).
    # Quiet window 23:00-05:00 Thai = 16:00-22:00 UTC (owner: no overnight updates needed) -> run UTC hours 0-15,22,23.
    # Thailand has no DST, so this mapping is stable year-round. Public repo = free Actions minutes.
    - cron: "7,22,37,52 0-15,22,23 * * *"
  workflow_dispatch:
    inputs:
      set_group:
        description: 'ตั้งกลุ่มรถจากแอป เช่น "4169:flatbed,4100:pen" (plate:auto = กลับไปอัตโนมัติ)'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-fleet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Enforce the 23:00-05:00 Thai quiet window for EVERY trigger, including
      # Apps Script workflow_dispatch (which runs promptly and ignores the cron window).
      - name: Time gate (skip 23:00-05:00 Thai; manual dispatch always runs)
        id: gate
        run: |
          H=$(TZ=Asia/Bangkok date +%H)
          echo "Thai hour = $H  (event: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch -> run regardless of quiet window"
          elif [ "$H" -ge 23 ] || [ "$H" -lt 5 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "quiet window (Thai ${H}:xx) - skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet openpyxl google-api-python-client google-auth

      - name: Apply truck group override from app (set_group input)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.set_group != ''
        env:
          SET_GROUP: ${{ github.event.inputs.set_group }}
        run: python pipeline/set_group.py "$SET_GROUP"

      - name: Run pipeline (retry transient upstream failures)
        if: steps.gate.outputs.run == 'true'
        env:
          DTC_TOKEN: ${{ secrets.DTC_TOKEN }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          # DTC/OSRM/Drive drop connections in bursts. Retry the whole run a few
          # times spread over ~3 min so a brief upstream outage doesn't skip an update.
          # Files are only committed by the next step, which is skipped if this exits 1,
          # so a failed attempt never commits partial data.
          for attempt in 1 2 3 4; do
            echo "::group::pipeline attempt $attempt"
            if python pipeline/run.py; then
              echo "::endgroup::"; echo "pipeline ok (attempt $attempt)"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 30))
          done
          echo "pipeline failed after 4 attempts (upstream likely down)"; exit 1

      - name: Commit data files if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "fleet-bot"
          git config user.email "actions@github.com"
          # stage ทีละไฟล์เฉพาะที่มีอยู่จริง — run ที่ต่อคิวจะ checkout SHA เก่าตอนถูกสั่ง
          # ไฟล์ใหม่ (เช่น truck-groups.json) อาจยังไม่มี; git add รายการเดียวรวดจะล้มทั้งชุด
          # แล้วเหลือไฟล์ไม่ได้ stage -> rebase ตอน push ชนกันล้ม ("unstaged changes")
          for f in fleet-status.json tracks.json gps2-history.jsonl route-track.jsonl assign-jobs.json truck-groups.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "Update fleet data [skip ci] $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && { echo "pushed update"; exit 0; }
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash -X theirs origin main
          done
          git push && echo "pushed update (final)" || { echo "push failed after retries"; exit 1; }
